[Unit]
Requires=dell-compute.target
After=dell-compute.target
PartOf=dell-compute.target
ConditionPathExists=!/run/dell-compute/quiesced
ConditionPathExists=!/var/lib/dell-standby/ACTIVE

[Service]
Slice=dell-compute-ci.slice
UMask=0077
PrivateTmp=yes
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=read-only
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
LockPersonality=yes
IPAddressDeny=100.64.0.0/10
InaccessiblePaths=/opt/Mobiup/unihub-retail
InaccessiblePaths=/opt/Mobiup/.ssh
InaccessiblePaths=/opt/Mobiup/.codex-worktrees
InaccessiblePaths=/opt/Mobiup/ops/runners/retail-deploy
InaccessiblePaths=/home/andrei/.ssh
InaccessiblePaths=/run/tailscale
InaccessiblePaths=-/storage/backups
ReadWritePaths=/opt/Mobiup/ops/runners/retail
ReadWritePaths=/var/cache/dell-compute
ReadWritePaths=/var/lib/dell-compute/test-data
Environment=RUNNER_TOOL_CACHE=/var/cache/dell-compute/actions-toolcache
Environment=NPM_CONFIG_CACHE=/var/cache/dell-compute/npm-retail
Environment=NPM_CONFIG_USERCONFIG=/dev/null
Environment=PIP_CACHE_DIR=/var/cache/dell-compute/pip-retail
Environment=XDG_CACHE_HOME=/var/cache/dell-compute/xdg-retail
Environment=PLAYWRIGHT_BROWSERS_PATH=/var/cache/dell-compute/playwright
