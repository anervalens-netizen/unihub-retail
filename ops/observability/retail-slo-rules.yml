groups:
  - name: unihub-retail-slo-recording
    interval: 30s
    rules:
      - record: unihub_retail:http_requests_excluding_probes:rate5m
        expr: >-
          sum(rate(http_requests_total{
            job="unihub-retail-web",
            handler!~"/(health|readyz|livez)"
          }[5m]))

      - record: unihub_retail:http_5xx_ratio:rate5m
        expr: >-
          (sum(rate(http_requests_total{
            job="unihub-retail-web",
            status="5xx",
            handler!~"/(health|readyz|livez)"
          }[5m])) or vector(0))
          /
          clamp_min(sum(rate(http_requests_total{
            job="unihub-retail-web",
            handler!~"/(health|readyz|livez)"
          }[5m])), 0.001)

      - record: unihub_retail:http_latency_p95_seconds:rate5m
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{
              job="unihub-retail-web",
              handler!~"/(health|readyz|livez)"
            }[5m]))
          )

      - record: unihub_retail:dashboard_latency_p95_seconds:rate5m
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{
              job="unihub-retail-web",
              handler="/api/dashboard/all"
            }[5m]))
          )

  - name: unihub-retail-slo-alerts
    rules:
      - alert: UniHubRetailPlannedDeployment
        expr: unihub_retail_deployment_in_progress == 1
        labels:
          severity: info
        annotations:
          summary: "Retail verified deployment is in progress"
          description: "Only Retail availability alerts are inhibited while the exact-SHA deploy marker exists."

      - alert: UniHubRetailReadinessProbeMissing
        expr: absent(probe_success{job="blackbox_retail_readiness"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Retail readiness probe is missing"
          description: "Prometheus has no external /readyz probe result for Retail."

      - alert: UniHubRetailReadinessDown
        expr: probe_success{job="blackbox_retail_readiness"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Retail is not ready"
          description: "The public /readyz dependency probe has failed for 2 minutes."

      - alert: UniHubRetailErrorRateSLO
        expr: >-
          unihub_retail:http_5xx_ratio:rate5m > 0.05
          and
          unihub_retail:http_requests_excluding_probes:rate5m > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Retail 5xx ratio exceeds the SLO guardrail"
          description: "Non-probe 5xx ratio is {{ $value | humanizePercentage }}."

      - alert: UniHubRetailLatencySLO
        expr: >-
          unihub_retail:http_latency_p95_seconds:rate5m > 2
          and
          unihub_retail:http_requests_excluding_probes:rate5m > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Retail p95 latency exceeds 2 seconds"
          description: "Non-probe p95 latency is {{ $value | humanizeDuration }}."

      - alert: UniHubRetailSingleSlowRequest
        expr: >-
          sum by (method, status, handler) (
            increase(http_slow_requests_total{job="unihub-retail-web"}[5m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "Retail request exceeded 3 seconds"
          description: "{{ $labels.method }} {{ $labels.handler }} ({{ $labels.status }}) had {{ $value | humanize }} slow request(s) in 5 minutes."

      - alert: UniHubRetailDashboardBudgetViolation
        expr: >-
          increase(dashboard_component_budget_violation_total{
            job="unihub-retail-web"
          }[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Retail Dashboard exceeded its global concurrency budget"
          description: "The bounded Dashboard scheduler reported {{ $value | humanize }} violation(s) in 5 minutes."

      - alert: UniHubRetailDashboardLatencySLO
        expr: >-
          unihub_retail:dashboard_latency_p95_seconds:rate5m > 1
          and
          sum(rate(http_requests_total{
            job="unihub-retail-web",
            handler="/api/dashboard/all"
          }[5m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Retail Dashboard p95 exceeds 1 second"
          description: "Dashboard p95 is {{ $value | humanizeDuration }}."
