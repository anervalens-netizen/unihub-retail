groups:
  - name: unihub-retail-slo-recording
    interval: 30s
    rules:
      - record: unihub_retail:http_requests_excluding_probes:rate5m
        expr: >-
          sum(rate(http_requests_total{
            job="unihub-retail-web",
            handler!~"/(health|readyz|livez)"
          }[5m]))

      - record: unihub_retail:http_5xx_ratio:rate5m
        expr: >-
          (sum(rate(http_requests_total{
            job="unihub-retail-web",
            status="5xx",
            handler!~"/(health|readyz|livez)"
          }[5m])) or vector(0))
          /
          clamp_min(sum(rate(http_requests_total{
            job="unihub-retail-web",
            handler!~"/(health|readyz|livez)"
          }[5m])), 0.001)

      - record: unihub_retail:http_latency_p95_seconds:rate5m
        expr: >-
          ((histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{
                job="unihub-retail-web",
                handler!~"/(health|readyz|livez)"
              }[5m]))
            ))
            ==
            (histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{
                job="unihub-retail-web",
                handler!~"/(health|readyz|livez)"
              }[5m]))
            ))) or vector(0)

      - record: unihub_retail:dashboard_latency_p95_seconds:rate5m
        expr: >-
          ((histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{
                job="unihub-retail-web",
                handler="/api/dashboard/all"
              }[5m]))
            ))
            ==
            (histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{
                job="unihub-retail-web",
                handler="/api/dashboard/all"
              }[5m]))
            ))) or vector(0)

  - name: unihub-retail-slo-alerts
    rules:
      - alert: UniHubRetailPlannedDeployment
        expr: unihub_retail_deployment_in_progress == 1
        labels:
          severity: info
        annotations:
          summary: "Retail verified deployment is in progress"
          description: "Only Retail availability alerts are inhibited while the exact-SHA deploy marker exists."

      - alert: UniHubRetailReadinessProbeMissing
        expr: absent(probe_success{job="blackbox_retail_readiness"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Retail readiness probe is missing"
          description: "Prometheus has no external /readyz probe result for Retail."

      - alert: UniHubRetailReadinessDown
        expr: probe_success{job="blackbox_retail_readiness"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Retail is not ready"
          description: "The public /readyz dependency probe has failed for 2 minutes."

      - alert: UniHubRetailWebTargetMissing
        expr: absent(up{job="unihub-retail-web"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Retail web metrics target is missing"
          description: "Prometheus has no web metrics target for 5 minutes."

      - alert: UniHubRetailWebTargetDown
        expr: up{job="unihub-retail-web"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Retail web metrics target is down"
          description: "unihub-retail-web has not been scraped successfully for 2 minutes."

      - alert: UniHubRetailErrorRateSLO
        expr: >-
          unihub_retail:http_5xx_ratio:rate5m > 0.05
          and
          unihub_retail:http_requests_excluding_probes:rate5m > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Retail 5xx ratio exceeds the SLO guardrail"
          description: "Non-probe 5xx ratio is {{ $value | humanizePercentage }}."

      - alert: UniHubRetailLatencySLO
        expr: >-
          unihub_retail:http_latency_p95_seconds:rate5m > 2
          and
          unihub_retail:http_requests_excluding_probes:rate5m > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Retail p95 latency exceeds 2 seconds"
          description: "Non-probe p95 latency is {{ $value | humanizeDuration }}."

      - alert: UniHubRetailSingleSlowRequest
        expr: >-
          sum by (method, status, handler) (
            increase(http_slow_requests_total{job="unihub-retail-web"}[5m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "Retail request exceeded 3 seconds"
          description: "{{ $labels.method }} {{ $labels.handler }} ({{ $labels.status }}) had {{ $value | humanize }} slow request(s) in 5 minutes."

      - alert: UniHubRetailDashboardBudgetViolation
        expr: >-
          increase(dashboard_component_budget_violation_total{
            job="unihub-retail-web"
          }[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Retail Dashboard exceeded its global concurrency budget"
          description: "The bounded Dashboard scheduler reported {{ $value | humanize }} violation(s) in 5 minutes."

      - alert: UniHubRetailDashboardLatencySLO
        expr: >-
          unihub_retail:dashboard_latency_p95_seconds:rate5m > 1
          and
          sum(rate(http_requests_total{
            job="unihub-retail-web",
            handler="/api/dashboard/all"
          }[5m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Retail Dashboard p95 exceeds 1 second"
          description: "Dashboard p95 is {{ $value | humanizeDuration }}."

      - alert: UniHubRetailOperationsTargetMissing
        expr: absent(up{job="unihub-retail-operations"})
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Retail operations worker target is missing"
          description: "Prometheus has no operations worker target for 5 minutes."

      - alert: UniHubRetailImportsTargetMissing
        expr: absent(up{job="unihub-retail-imports"})
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Retail imports worker target is missing"
          description: "Prometheus has no imports worker target for 5 minutes."

      - alert: UniHubRetailGrileTargetMissing
        expr: absent(up{job="unihub-retail-grile"})
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Retail Grile worker target is missing"
          description: "Prometheus has no Grile worker target for 5 minutes."

      - alert: UniHubRetailExportsTargetMissing
        expr: absent(up{job="unihub-retail-exports"})
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Retail exports worker target is missing"
          description: "Prometheus has no exports worker target for 5 minutes."

      - alert: UniHubRetailSalaryExportsTargetMissing
        expr: absent(up{job="unihub-retail-salary-exports"})
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Retail salary exports worker target is missing"
          description: "Prometheus has no salary exports worker target for 5 minutes."

      - alert: UniHubRetailWorkerTargetDown
        expr: min by (job) (up{job=~"unihub-retail-(operations|imports|grile|exports|salary-exports)"}) == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Retail worker metrics target is down"
          description: "{{ $labels.job }} has not been scraped successfully for 2 minutes."

      - alert: UniHubRetailWorkerReportedDown
        expr: unihub_worker_up{service_role=~"operations|imports|grile|exports|salary_exports"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Retail worker reports itself down"
          description: "{{ $labels.job }} ({{ $labels.service_role }}) has reported down for 2 minutes."

      - alert: UniHubRetailWorkerQueueBacklog
        expr: unihub_worker_queue_backlog{service_role=~"operations|imports|grile|exports|salary_exports"} > 25
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Retail worker queue backlog is elevated"
          description: "{{ $labels.service_role }} has {{ $value | humanize }} queued jobs."

      - alert: UniHubRetailWorkerQueueOldestAge
        expr: unihub_worker_queue_oldest_age_seconds{service_role=~"operations|imports|grile|exports|salary_exports"} > 900
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Retail queued job is stale"
          description: "The oldest {{ $labels.service_role }} job is {{ $value | humanizeDuration }} old."

      - alert: UniHubRetailWorkerFailureRatio
        expr: >-
          sum by (service_role) (rate(unihub_worker_job_results_total{result="failed"}[15m]))
          /
          clamp_min(sum by (service_role) (rate(unihub_worker_job_results_total[15m])), 0.001)
          > 0.25
          and
          sum by (service_role) (rate(unihub_worker_job_results_total[15m])) > 0.01
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Retail worker failure ratio is elevated"
          description: "{{ $labels.service_role }} failure ratio is {{ $value | humanizePercentage }}."

      - alert: UniHubRetailWorkerJobDuration
        expr: >-
          histogram_quantile(0.95,
            sum by (le, service_role) (rate(unihub_worker_job_duration_seconds_bucket[30m]))
          ) > 1200
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Retail worker p95 duration exceeds 20 minutes"
          description: "{{ $labels.service_role }} p95 is {{ $value | humanizeDuration }}."

      - alert: UniHubRetailGrileReconciliationStale
        expr: >-
          time() - unihub_grile_monthly_reconcile_last_success_timestamp_seconds{
            service_role="grile"
          } > 180
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Retail Grile monthly reconciliation is stale"
          description: "The last successful reconciliation is {{ $value | humanizeDuration }} old."

      - alert: UniHubRetailGrileReconciliationFailures
        expr: >-
          unihub_grile_monthly_reconcile_consecutive_failures{
            service_role="grile"
          } >= 3
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Retail Grile reconciliation repeatedly fails"
          description: "Monthly reconciliation has failed {{ $value | humanize }} consecutive times."
