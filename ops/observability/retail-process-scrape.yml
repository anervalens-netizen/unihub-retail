# Rendered by the exact-SHA deploy after it validates the Prometheus bridge.
# The placeholder must be replaced with that bridge gateway before activation.
scrape_configs:
  - job_name: unihub-retail-web
    static_configs:
      - targets: ["__PROMETHEUS_DOCKER_GATEWAY__:9898"]
        labels:
          service_role: web

  - job_name: unihub-retail-operations
    static_configs:
      - targets: ["__PROMETHEUS_DOCKER_GATEWAY__:9901"]
        labels:
          service_role: operations

  - job_name: unihub-retail-imports
    static_configs:
      - targets: ["__PROMETHEUS_DOCKER_GATEWAY__:9902"]
        labels:
          service_role: imports
