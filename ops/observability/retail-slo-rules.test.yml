rule_files:
  - retail-slo-rules.yml

evaluation_interval: 1m

tests:
  - name: Latency recordings remain present without traffic
    interval: 1m
    promql_expr_test:
      - expr: unihub_retail:http_latency_p95_seconds:rate5m
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="unihub_retail:http_latency_p95_seconds:rate5m"}'
            value: 0
      - expr: unihub_retail:dashboard_latency_p95_seconds:rate5m
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="unihub_retail:dashboard_latency_p95_seconds:rate5m"}'
            value: 0

  - name: Latency recordings replace idle histogram NaN with zero
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{job="unihub-retail-web",method="GET",status="2xx",handler="/api/dashboard/all",le="0.5"}'
        values: '0x10'
      - series: 'http_request_duration_seconds_bucket{job="unihub-retail-web",method="GET",status="2xx",handler="/api/dashboard/all",le="+Inf"}'
        values: '0x10'
    promql_expr_test:
      - expr: unihub_retail:http_latency_p95_seconds:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="unihub_retail:http_latency_p95_seconds:rate5m"}'
            value: 0
      - expr: unihub_retail:dashboard_latency_p95_seconds:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="unihub_retail:dashboard_latency_p95_seconds:rate5m"}'
            value: 0

  - name: HTTP recording rules use the live web job
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="unihub-retail-web",method="GET",status="2xx",handler="/api/dashboard/all"}'
        values: '0+90x20'
      - series: 'http_requests_total{job="unihub-retail-web",method="GET",status="5xx",handler="/api/dashboard/all"}'
        values: '0+10x20'
      - series: 'http_request_duration_seconds_bucket{job="unihub-retail-web",method="GET",status="2xx",handler="/api/dashboard/all",le="0.5"}'
        values: '0+80x20'
      - series: 'http_request_duration_seconds_bucket{job="unihub-retail-web",method="GET",status="2xx",handler="/api/dashboard/all",le="1"}'
        values: '0+90x20'
      - series: 'http_request_duration_seconds_bucket{job="unihub-retail-web",method="GET",status="2xx",handler="/api/dashboard/all",le="+Inf"}'
        values: '0+100x20'
    promql_expr_test:
      - expr: unihub_retail:http_requests_excluding_probes:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="unihub_retail:http_requests_excluding_probes:rate5m"}'
            value: 1.6666666666666667
      - expr: unihub_retail:http_5xx_ratio:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="unihub_retail:http_5xx_ratio:rate5m"}'
            value: 0.09999999999999999
    alert_rule_test:
      - eval_time: 15m
        alertname: UniHubRetailErrorRateSLO
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Retail 5xx ratio exceeds the SLO guardrail
              description: Non-probe 5xx ratio is 10%.

  - name: Worker self-report down is alertable
    interval: 1m
    input_series:
      - series: 'unihub_worker_up{job="unihub-retail-grile",service_role="grile"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: UniHubRetailWorkerReportedDown
        exp_alerts:
          - exp_labels:
              job: unihub-retail-grile
              service_role: grile
              severity: critical
            exp_annotations:
              summary: Retail worker reports itself down
              description: unihub-retail-grile (grile) has reported down for 2 minutes.

  - name: Grile reconciliation alerts ignore zero gauges exported by other worker roles
    interval: 1m
    input_series:
      - series: 'unihub_grile_monthly_reconcile_last_success_timestamp_seconds{job="unihub-retail-operations",service_role="operations"}'
        values: '0x10'
      - series: 'unihub_grile_monthly_reconcile_last_success_timestamp_seconds{job="unihub-retail-grile",service_role="grile"}'
        values: '0x10'
      - series: 'unihub_grile_monthly_reconcile_consecutive_failures{job="unihub-retail-imports",service_role="imports"}'
        values: '4x10'
      - series: 'unihub_grile_monthly_reconcile_consecutive_failures{job="unihub-retail-grile",service_role="grile"}'
        values: '4x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: UniHubRetailGrileReconciliationStale
        exp_alerts:
          - exp_labels:
              job: unihub-retail-grile
              service_role: grile
              severity: critical
            exp_annotations:
              summary: Retail Grile monthly reconciliation is stale
              description: The last successful reconciliation is 6m 0s old.
      - eval_time: 5m
        alertname: UniHubRetailGrileReconciliationFailures
        exp_alerts:
          - exp_labels:
              job: unihub-retail-grile
              service_role: grile
              severity: critical
            exp_annotations:
              summary: Retail Grile reconciliation repeatedly fails
              description: Monthly reconciliation has failed 4 consecutive times.

  - name: Web metrics target missing fires after the configured duration
    interval: 1m
    alert_rule_test:
      - eval_time: 4m
        alertname: UniHubRetailWebTargetMissing
      - eval_time: 6m
        alertname: UniHubRetailWebTargetMissing
        exp_alerts:
          - exp_labels:
              job: unihub-retail-web
              severity: critical
            exp_annotations:
              summary: Retail web metrics target is missing
              description: Prometheus has no web metrics target for 5 minutes.

  - name: Web metrics target down fires after the configured duration
    interval: 1m
    input_series:
      - series: 'up{job="unihub-retail-web",instance="web:9898"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: UniHubRetailWebTargetDown
      - eval_time: 3m
        alertname: UniHubRetailWebTargetDown
        exp_alerts:
          - exp_labels:
              instance: web:9898
              job: unihub-retail-web
              severity: critical
            exp_annotations:
              summary: Retail web metrics target is down
              description: unihub-retail-web has not been scraped successfully for 2 minutes.
