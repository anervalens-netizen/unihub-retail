name: pr-merge-gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run:
    workflows: [CI, docs-contract, high-risk-governance, pr-deep-policy, pr-deep]
    types: [completed]
  status:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: write

# Every invocation can publish the same retail/pr-merge-gate context, and a
# main push can invalidate every open PR. Serialize all writers repository-wide
# so an older evaluation cannot overwrite a newer result. queue:max preserves
# concurrent triggers instead of canceling another PR's reevaluation.
concurrency:
  group: pr-merge-gate-writer
  cancel-in-progress: false
  queue: max

jobs:
  evaluate:
    if: >-
      github.event_name != 'status' ||
      github.event.context == 'retail/pr-deep-policy' ||
      github.event.context == 'retail/pr-deep'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted PR base
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Checkout trusted current main
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Resolve trusted PR-DEEP workflow_run candidate
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIDGE_EVENT_PATH: /tmp/pr-merge-gate-candidate-event.json
        run: python3 .github/governance/pr_merge_gate_workflow_run_bridge.py

      - name: Evaluate exact-HEAD merge gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRIDGE_EVENT_PATH: /tmp/pr-merge-gate-candidate-event.json
        run: |
          set -euo pipefail
          if [ -f "$BRIDGE_EVENT_PATH" ]; then
            GITHUB_EVENT_NAME=status \
              GITHUB_EVENT_PATH="$BRIDGE_EVENT_PATH" \
              python3 scripts/pr_merge_gate.py
          else
            python3 scripts/pr_merge_gate.py
          fi
