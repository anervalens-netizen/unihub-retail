name: CI

on:
  # Internal pull requests receive exact-SHA verification. Dispatch on main
  # remains the immutable release-artifact gate.
  workflow_dispatch:
    inputs:
      release_phase:
        description: Exact main artifact phase
        required: true
        type: choice
        options:
          - release-a
          - release-b
      release_a_sha:
        description: Exact Release-A main SHA, required only for Release B
        required: false
        type: string
      release_a_run_id:
        description: Exact Release-A main workflow run ID, required only for Release B
        required: false
        type: string
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-isolation:
    name: runner-isolation
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      ||
      (github.event_name == 'pull_request'
       && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, dell-compute, unihub-build, unihub-retail-build]
    timeout-minutes: 5
    steps:
      - name: Prove trusted Dell runner isolation
        env:
          EXPECTED_RUNNER_ENVIRONMENT: self-hosted
          EXPECTED_RUNNER_NAME: dell-retail-build
          BLOCKED_TIMESFM_PEER: 100.74.73.114
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "$EXPECTED_RUNNER_ENVIRONMENT"
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$(hostname)" = "dell-standby"
          test ! -e /run/dell-compute/quiesced
          test ! -e /var/lib/dell-standby/ACTIVE
          test ! -r /opt/Mobiup/unihub-retail/.env
          test ! -r /opt/Mobiup/.ssh/id_ed25519_mobiup_primary_admin
          test ! -r /home/andrei/.ssh/id_ed25519
          test ! -e /storage/backups
          test ! -e /run/tailscale/tailscaled.sock
          if curl --silent --show-error --noproxy '*' \
            --connect-timeout 2 --max-time 4 \
            "http://$BLOCKED_TIMESFM_PEER:8000/" >/dev/null 2>&1; then
            echo "Build runner unexpectedly reached the private TimesFM peer" >&2
            exit 1
          fi
          test -S /var/run/docker.sock
          test "$(docker info --format '{{.Name}}')" = "dell-standby"

  backend-check:
    name: backend-check
    needs: runner-isolation
    runs-on: [self-hosted, Linux, X64, dell-compute, unihub-build, unihub-retail-build]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Prepare Python environment
        run: |
          python -m venv venv
          venv/bin/pip install --disable-pip-version-check --quiet \
            --require-hashes -r requirements-dev.lock

      - name: Generate exact-main Release-A schema evidence
        if: github.event_name == 'workflow_dispatch' && inputs.release_phase == 'release-a'
        working-directory: .
        run: |
          scripts/run_release_a_schema_gate.sh \
            --evidence "test-results/closure/$GITHUB_SHA/release-a/schema-gate.json"

      - name: Upload exact-main Release-A schema evidence
        if: github.event_name == 'workflow_dispatch' && inputs.release_phase == 'release-a'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retail-release-a-schema-${{ github.sha }}
          path: test-results/closure/${{ github.sha }}/release-a/
          if-no-files-found: error
          retention-days: 14

      - name: Generate faithful Python runtime SBOM
        run: |
          venv/bin/cyclonedx-py requirements requirements.lock \
            --output-reproducible --output-format JSON \
            --output-file python-runtime.cdx.json
          venv/bin/python ../scripts/validate_release_sbom.py \
            pypi python-runtime.cdx.json

      - name: Upload Python runtime SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retail-python-sbom-${{ github.sha }}
          path: backend/python-runtime.cdx.json
          if-no-files-found: error
          retention-days: 5

      - name: Runtime dependency smoke
        run: |
          runtime_root="$(mktemp -d)"
          trap 'rm -rf "$runtime_root"' EXIT
          runtime_venv="$runtime_root/venv"
          python -m venv "$runtime_venv"
          "$runtime_venv/bin/pip" install --disable-pip-version-check --quiet \
            --require-hashes -r requirements.lock
          "$runtime_venv/bin/pip" check
          "$runtime_venv/bin/python" -c "import auth; import main; import worker"

      - name: Python dependency vulnerability audit
        run: venv/bin/pip-audit -r requirements.lock --strict --progress-spinner off

      - name: Tracked secret regression scan
        working-directory: .
        run: |
          # Immutable manifests/contracts consist primarily of versioned
          # digests or synthetic golden identifiers. Dedicated exact-hash
          # contract gates validate them; the entropy heuristic adds no secret
          # detection value for those files. Prometheus fixtures contain only
          # deterministic runtime-directory literals and have their own gates.
          mapfile -d '' tracked_files < <(
            git ls-files -z -- . \
              ':(exclude).secrets.baseline' \
              ':(exclude).bandit-baseline.json' \
              ':(exclude)backend/db/migrations/manifest.json' \
              ':(exclude).agent/contract-lock.json' \
              ':(exclude)docs/contracts/ai-governance-golden-v1.json' \
              ':(exclude)docs/contracts/business-golden-v2.json' \
              ':(exclude)docs/contracts/query-parameter-policy-v1.json' \
              ':(exclude)scripts/frontend-critical-coverage.json' \
              ':(exclude)scripts/python-complexity-contract-v1.json' \
              ':(exclude)scripts/release-a-source-contract-v1.json' \
              ':(exclude)scripts/release-b-authority-contract-v1.json' \
              ':(exclude)scripts/check_release_a_candidate.py' \
              ':(exclude)scripts/verify_promtool_cache.sh' \
              ':(exclude)backend/scripts/run_outbox_slo_workload.py' \
              ':(exclude)scripts/run_outbox_slo_gate.py' \
              ':(exclude)scripts/run_structural_characterization.sh' \
              ':(exclude)scripts/structural-characterization-baseline-v1.json' \
              ':(exclude)backend/scripts/run_retail_scale_profile.py' \
              ':(exclude)scripts/run_retail_scale_gate.sh' \
              ':(exclude)scripts/run_local_quality_gate.sh' \
              ':(exclude)scripts/verify_deployed_release.sh' \
              ':(exclude)ops/build-retail-release-artifact.sh' \
              ':(exclude)backend/tests/test_release_contract_tooling_security.py' \
              ':(exclude)scripts/target-mutation-contract-v2.json' \
              ':(exclude)scripts/run_release_a_schema_gate.sh' \
              ':(exclude)scripts/run_real_e2e.sh' \
              ':(exclude)backend/tests/test_prometheus_topology.py' \
              ':(exclude)ops/systemd/unihub-backend.service'
          )
          backend/venv/bin/detect-secrets-hook \
            --baseline .secrets.baseline \
            "${tracked_files[@]}"
          # Keep all credential-shaped detectors active on the exact immutable
          # files while disabling only the two noisy entropy heuristics.
          backend/venv/bin/detect-secrets scan \
            --disable-plugin HexHighEntropyString \
            --disable-plugin Base64HighEntropyString \
            .agent/contract-lock.json \
            docs/contracts/ai-governance-golden-v1.json \
            docs/contracts/business-golden-v2.json \
            docs/contracts/query-parameter-policy-v1.json \
            scripts/frontend-critical-coverage.json \
            scripts/python-complexity-contract-v1.json \
            scripts/release-a-source-contract-v1.json \
            scripts/release-b-authority-contract-v1.json \
            scripts/check_release_a_candidate.py \
            scripts/verify_promtool_cache.sh \
            backend/scripts/run_outbox_slo_workload.py \
            scripts/run_outbox_slo_gate.py \
            scripts/run_structural_characterization.sh \
            scripts/structural-characterization-baseline-v1.json \
            backend/scripts/run_retail_scale_profile.py \
            scripts/run_retail_scale_gate.sh \
            scripts/run_local_quality_gate.sh \
            scripts/verify_deployed_release.sh \
            ops/build-retail-release-artifact.sh \
            backend/tests/test_release_contract_tooling_security.py \
            scripts/target-mutation-contract-v2.json \
            scripts/run_release_a_schema_gate.sh \
            scripts/run_real_e2e.sh \
            > /tmp/retail-immutable-contract-secret-scan.json
          test "$(backend/venv/bin/python -c 'import json; print(sum(len(v) for v in json.load(open("/tmp/retail-immutable-contract-secret-scan.json"))["results"].values()))')" = 0

      - name: Bandit waiver governance
        working-directory: .
        run: backend/venv/bin/python scripts/check_bandit_waivers.py

      - name: Python static security regression scan
        working-directory: .
        run: |
          backend/venv/bin/bandit \
            -r backend \
            -x backend/tests,backend/venv \
            -ll \
            -ii \
            -q \
            -b .bandit-baseline.json

      - name: Python typecheck
        run: |
          set +e
          venv/bin/mypy . --ignore-missing-imports --explicit-package-bases \
            > mypy-report.txt 2>&1
          status=$?
          cat mypy-report.txt
          exit $status

      - name: Immutable migration manifest
        run: |
          venv/bin/python -c "from db.migration_runner import load_migration_manifest, verify_migration_files; verify_migration_files(load_migration_manifest())"

      - name: OpenAPI contract drift
        working-directory: .
        run: PYTHONPATH=backend backend/venv/bin/python scripts/generate_retail_contract.py --check

      - name: Environment schema and process templates
        working-directory: .
        run: PYTHONPATH=backend backend/venv/bin/python scripts/check_env_contract.py

      - name: Versioned Retail edge request limits
        working-directory: .
        run: |
          docker run --rm --network none \
            -v "$PWD/ops/caddy:/etc/caddy:ro" \
            caddy:2.11.4 \
            caddy validate --config /etc/caddy/Caddyfile.validate --adapter caddyfile

      - name: Frontend dependency policy
        working-directory: .
        run: node scripts/check_dependency_policy.mjs

      - name: Python complexity ratchet
        working-directory: .
        run: backend/venv/bin/python scripts/check_complexity_ratchet.py

      - name: Changed-function complexity gate
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          COMPLEXITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$COMPLEXITY_BASE_SHA"
          backend/venv/bin/python scripts/check_changed_function_complexity.py \
            --base "$COMPLEXITY_BASE_SHA" --maximum 20

      - name: Backend architecture boundaries
        working-directory: .
        run: backend/venv/bin/python scripts/check_backend_architecture.py

      - name: Shell static analysis
        working-directory: .
        run: scripts/run_shellcheck.sh

      - name: Operational configuration validation
        working-directory: .
        env:
          PROMETHEUS_VERSION: 3.11.3
          PROMETHEUS_SHA256: 9479af67673316278958cda1f39b88a09f8921084e039c65acca060d0447bb38  # pragma: allowlist secret
        run: |
          systemd_root="$(mktemp -d)"
          prom_root="$(mktemp -d)"
          trap 'rm -rf "$systemd_root" "$prom_root"' EXIT
          mkdir -p \
            "$systemd_root/usr/lib/systemd" \
            "$systemd_root/etc/systemd/system" \
            "$systemd_root/usr/bin" \
            "$systemd_root/opt/Mobiup/unihub-retail/backend/venv/bin" \
            "$systemd_root/opt/Mobiup/ops/prometheus" \
            "$prom_root/scrape.d"
          cp -a /usr/lib/systemd/system "$systemd_root/usr/lib/systemd/"
          cp \
            "$GITHUB_WORKSPACE/ops/systemd/unihub-backend.service" \
            "$GITHUB_WORKSPACE/unihub-worker.service" \
            "$GITHUB_WORKSPACE/ops/systemd/unihub-import-worker.service" \
            "$GITHUB_WORKSPACE/ops/systemd/unihub-grile-worker.service" \
            "$GITHUB_WORKSPACE/ops/systemd/unihub-export-worker.service" \
            "$GITHUB_WORKSPACE/ops/systemd/unihub-salary-export-worker.service" \
            "$GITHUB_WORKSPACE/ops/systemd/unihub-legacy-worker.service" \
            "$GITHUB_WORKSPACE/ops/systemd/unihub-retail-migrate.service" \
            "$systemd_root/etc/systemd/system/"
          printf '[Service]\nType=oneshot\nExecStart=/usr/bin/true\n' \
            > "$systemd_root/etc/systemd/system/docker.service"
          cp "$systemd_root/etc/systemd/system/docker.service" \
            "$systemd_root/etc/systemd/system/mobiup-dwh-postgres.service"
          touch \
            "$systemd_root/opt/Mobiup/unihub-retail/.env" \
            "$systemd_root/opt/Mobiup/unihub-retail/.env.worker" \
            "$systemd_root/opt/Mobiup/unihub-retail/.env.import-worker" \
            "$systemd_root/opt/Mobiup/unihub-retail/.env.salary-export-worker" \
            "$systemd_root/opt/Mobiup/unihub-retail/.env.migrations" \
            "$systemd_root/opt/Mobiup/ops/prometheus/unihub-retail-network.env"
          cp /usr/bin/true "$systemd_root/usr/bin/true"
          cp /usr/bin/false "$systemd_root/usr/bin/false"
          cp /usr/bin/timeout "$systemd_root/usr/bin/timeout"
          cp /usr/bin/true \
            "$systemd_root/opt/Mobiup/unihub-retail/backend/venv/bin/python"
          cp /usr/bin/true \
            "$systemd_root/opt/Mobiup/unihub-retail/backend/venv/bin/python3"
          systemd-analyze verify --root="$systemd_root" \
            "$systemd_root/etc/systemd/system/unihub-backend.service" \
            "$systemd_root/etc/systemd/system/unihub-worker.service" \
            "$systemd_root/etc/systemd/system/unihub-import-worker.service" \
            "$systemd_root/etc/systemd/system/unihub-grile-worker.service" \
            "$systemd_root/etc/systemd/system/unihub-export-worker.service" \
            "$systemd_root/etc/systemd/system/unihub-salary-export-worker.service" \
            "$systemd_root/etc/systemd/system/unihub-legacy-worker.service" \
            "$systemd_root/etc/systemd/system/unihub-retail-migrate.service"
          visudo -cf "$GITHUB_WORKSPACE/ops/unihub-deploy.sudoers"
          grep -Fq "/usr/local/sbin/unihub-deploy-lock acquire *" \
            "$GITHUB_WORKSPACE/ops/unihub-deploy.sudoers"
          grep -Fq "/usr/local/sbin/unihub-deploy-lock release *" \
            "$GITHUB_WORKSPACE/ops/unihub-deploy.sudoers"
          scripts/verify_promtool_cache.sh prepare \
            --version "$PROMETHEUS_VERSION" \
            --sha256 "$PROMETHEUS_SHA256" \
            --cache-dir "${RUNNER_TOOL_CACHE}/unihub-prometheus" \
            --destination "$prom_root/promtool" \
            --evidence "$GITHUB_WORKSPACE/test-results/promtool-cache.json"
          "$prom_root/promtool" check rules \
            "$GITHUB_WORKSPACE/ops/observability/retail-slo-rules.yml"
          python3 "$GITHUB_WORKSPACE/scripts/check_prometheus_contract.py"
          (
            cd "$GITHUB_WORKSPACE/ops/observability"
            "$prom_root/promtool" test rules retail-slo-rules.test.yml
          )
          sed 's/__PROMETHEUS_DOCKER_GATEWAY__/172.23.0.1/g' \
            "$GITHUB_WORKSPACE/ops/observability/retail-process-scrape.yml" \
            > "$prom_root/scrape.d/unihub-retail.yml"
          printf '%s\n' \
            'global:' \
            '  scrape_interval: 15s' \
            'scrape_config_files:' \
            "  - $prom_root/scrape.d/*.yml" \
            > "$prom_root/prometheus.yml"
          "$prom_root/promtool" check config "$prom_root/prometheus.yml"
          test "$(grep -Fc '172.23.0.1:' "$prom_root/scrape.d/unihub-retail.yml")" -eq 6
          ! grep -Eq '__PROMETHEUS_DOCKER_GATEWAY__|0\.0\.0\.0|127\.0\.0\.1' \
            "$prom_root/scrape.d/unihub-retail.yml"

      - name: Upload Promtool cache evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promtool-cache-${{ github.sha }}
          path: test-results/promtool-cache.json
          if-no-files-found: error
          retention-days: 14

      - name: Exact-SHA deploy and rollback sandbox
        working-directory: .
        run: ops/test-deploy-retail-artifact.sh

      - name: Upload mypy diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mypy-report
          path: backend/mypy-report.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Backend tests
        run: |
          set +e
          scripts/run_tests_isolated.sh \
            -v \
            --tb=short \
            --cov=. \
            --cov-config=../.coveragerc \
            --cov-fail-under=80 \
            --cov-report=term \
            --cov-report=json:global-coverage.json \
            > backend-test-report.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            venv/bin/python scripts/check_critical_coverage.py \
              global-coverage.json >> backend-test-report.txt 2>&1
            status=$?
          fi
          cat backend-test-report.txt
          exit $status

      - name: Targeted business mutation gate
        working-directory: .
        run: backend/venv/bin/python scripts/run_targeted_mutation_tests.py

      - name: Backend changed-line coverage gate
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$COVERAGE_BASE_SHA"
          venv/bin/python ../scripts/check_changed_line_coverage.py \
            --base "$COVERAGE_BASE_SHA" \
            --backend-json global-coverage.json \
            --minimum 80

      - name: Upload backend test diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-report
          path: |
            backend/backend-test-report.txt
            backend/global-coverage.json
          if-no-files-found: warn
          retention-days: 3

  frontend-check:
    name: frontend-check
    needs: runner-isolation
    runs-on: [self-hosted, Linux, X64, dell-compute, unihub-build, unihub-retail-build]
    timeout-minutes: 25
    env:
      VITE_FRONTEND_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Verify vendored private packages
        run: node scripts/verify_vendored_npm_packages.mjs

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Generate faithful npm runtime SBOM
        run: |
          npm sbom --package-lock-only --omit=dev \
            --sbom-format cyclonedx --sbom-type application \
            > npm-runtime.cdx.json
          python3 scripts/validate_release_sbom.py npm npm-runtime.cdx.json

      - name: Upload npm runtime SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retail-npm-sbom-${{ github.sha }}
          path: npm-runtime.cdx.json
          if-no-files-found: error
          retention-days: 5

      - name: Frontend typecheck
        run: npm run typecheck

      - name: TypeScript complexity ratchet
        run: node scripts/check_ts_function_complexity.cjs

      - name: Frontend lint
        run: npm run lint

      - name: Unit tests with global coverage floor
        run: npm run test:coverage

      - name: Changed-line coverage gate
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$COVERAGE_BASE_SHA"
          python3 scripts/check_changed_line_coverage.py \
            --base "$COVERAGE_BASE_SHA" \
            --frontend-lcov coverage/frontend/lcov.info \
            --minimum 80

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Verify production RUM artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: npm run verify:rum-build

      - name: Bind production frontend build input without disclosure
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          [[ -n "$VITE_FRONTEND_GLITCHTIP_DSN" ]]
          [[ "$VITE_FRONTEND_GLITCHTIP_DSN" != *$'\n'* ]]
          [[ "$VITE_FRONTEND_GLITCHTIP_DSN" != *$'\r'* ]]
          printf '%s' "$VITE_FRONTEND_GLITCHTIP_DSN" \
            | sha256sum | awk '{print $1}' > frontend-build-input.sha256

      - name: Bundle budget
        run: node scripts/check_bundle_budget.mjs

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Real Workbox release lifecycle
        env:
          PWA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$PWA_BASE_SHA" ]]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
            PWA_BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
            export PWA_BASE_SHA
          fi
          if ! git cat-file -e "$PWA_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$PWA_BASE_SHA"
          fi
          scripts/run_pwa_release_lifecycle.sh

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload tested frontend build
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retail-tested-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload frontend build-input identity
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retail-frontend-build-input-${{ github.sha }}
          path: frontend-build-input.sha256
          if-no-files-found: error
          retention-days: 3


  browser-smoke:
    name: browser-smoke
    needs: runner-isolation
    runs-on: [self-hosted, Linux, X64, dell-compute, unihub-build, unihub-retail-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Build browser-smoke artifact
        env:
          VITE_FRONTEND_GLITCHTIP_DSN: ""
        run: npm run build

      - name: Install Firefox and WebKit
        run: npx playwright install firefox webkit

      - name: Cross-browser keyboard smoke
        run: npm run test:e2e:browsers

      - name: Upload cross-browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-browser-smoke-report
          path: |
            playwright-report-browser-smoke/
            test-results/browser-smoke/
          if-no-files-found: warn
          retention-days: 3

  integration-e2e:
    name: integration-e2e
    needs: runner-isolation
    runs-on: [self-hosted, Linux, X64, dell-compute, unihub-build, unihub-retail-build]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install full-stack test dependencies
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install --disable-pip-version-check --quiet \
            --require-hashes -r backend/requirements-dev.lock
          npm ci --include=dev

      - name: Build tested frontend
        env:
          VITE_FRONTEND_GLITCHTIP_DSN: ""
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Real full-stack integration gate
        env:
          REAL_E2E_SKIP_BUILD: "1"
        run: scripts/run_real_e2e.sh

      - name: Upload restore business evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retail-restore-business-evidence
          path: |
            test-results/real-e2e-restore-drill.json
            test-results/real-e2e-restore-drill.json.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Upload real integration diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-real-integration-report
          path: |
            playwright-report-real/
            playwright-report-pwa-workbox/
            test-results/real-e2e/
            test-results/real-e2e-runtime/
            test-results/real-e2e-import-overlap.json
            test-results/real-e2e-load-gate.json
            test-results/real-e2e-restore-drill.json
            test-results/real-e2e-restore-drill.json.sha256
            test-results/real-e2e-worker-recovery.json
            test-results/pwa-workbox/
          if-no-files-found: warn
          retention-days: 5

  release-artifact:
    name: release-artifact
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [backend-check, frontend-check, browser-smoke, integration-e2e]
    runs-on: [self-hosted, Linux, X64, dell-compute, unihub-build, unihub-retail-build]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download exact tested frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: retail-tested-dist-${{ github.sha }}
          path: dist

      - name: Download official ecosystem SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: retail-*-sbom-${{ github.sha }}
          path: supply-chain
          merge-multiple: true

      - name: Download exact frontend build-input identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: retail-frontend-build-input-${{ github.sha }}
          path: supply-chain/frontend-build

      - name: Validate Release-B ancestry inputs
        if: inputs.release_phase == 'release-b'
        env:
          RELEASE_A_SHA: ${{ inputs.release_a_sha }}
          RELEASE_A_RUN_ID: ${{ inputs.release_a_run_id }}
        run: |
          [[ "$RELEASE_A_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_A_RUN_ID" =~ ^[0-9]+$ ]]
          git merge-base --is-ancestor "$RELEASE_A_SHA" "$GITHUB_SHA"

      - name: Download exact Release-A artifact for Release-B policy proof
        if: inputs.release_phase == 'release-b'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: retail-release-${{ inputs.release_a_sha }}
          path: release-a-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_a_run_id }}

      - name: Download exact-main Release-A schema evidence
        if: inputs.release_phase == 'release-a'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: retail-release-a-schema-${{ github.sha }}
          path: release-a-schema-evidence

      - name: Package exact-SHA release with evidence
        env:
          RELEASE_BUILDER_ID: "github-actions://${{ github.repository }}/.github/workflows/ci.yml@${{ github.workflow_sha }}"
          RELEASE_INVOCATION_ID: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
          NPM_SBOM_PATH: supply-chain/npm-runtime.cdx.json
          PYTHON_SBOM_PATH: supply-chain/python-runtime.cdx.json
          FRONTEND_BUILD_INPUT_SHA256_FILE: supply-chain/frontend-build/frontend-build-input.sha256
          RELEASE_A_EVIDENCE_DIR: ${{ inputs.release_phase == 'release-a' && 'release-a-schema-evidence' || '' }}
          RELEASE_A_EVIDENCE_RUN_ID: ${{ inputs.release_phase == 'release-a' && github.run_id || '' }}
        run: ops/build-retail-release-artifact.sh "$GITHUB_SHA" release-artifact

      - name: Install externally rooted signer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        env:
          HOME: ${{ runner.temp }}
        with:
          cosign-release: v3.1.3
          install-dir: ${{ runner.temp }}/cosign

      - name: Sign and verify release evidence with Sigstore
        env:
          HOME: ${{ runner.temp }}
        run: |
          cosign sign-blob --yes \
            --bundle release-artifact/RELEASE_MANIFEST.sigstore.json \
            release-artifact/RELEASE_MANIFEST.json
          cosign verify-blob release-artifact/RELEASE_MANIFEST.json \
            --bundle release-artifact/RELEASE_MANIFEST.sigstore.json \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com"

      - name: Rebuild exact main and audit signed artifact
        env:
          VITE_FRONTEND_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
          RELEASE_PHASE: ${{ inputs.release_phase }}
          RELEASE_A_SHA: ${{ inputs.release_a_sha }}
          ARTIFACT_AUDIT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_AUDIT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ARTIFACT_AUDIT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          audit_root="$(mktemp -d "$RUNNER_TEMP/retail-artifact-audit.XXXXXX")"
          trap 'git worktree remove --force "$audit_root/checkout" >/dev/null 2>&1 || true; rm -rf -- "$audit_root"' EXIT
          git worktree add --detach "$audit_root/checkout" "$GITHUB_SHA"
          args=(
            --verify-artifact-checkout "$GITHUB_WORKSPACE/release-artifact"
            --expected-sha "$GITHUB_SHA"
            --artifact-phase "$RELEASE_PHASE"
            --frontend-rum-dsn-from-environment
            --evidence "$GITHUB_WORKSPACE/artifact-checkout.json"
          )
          if [[ "$RELEASE_PHASE" == "release-b" ]]; then
            args+=(
              --release-a-sha "$RELEASE_A_SHA"
              --release-a-artifact-dir "$GITHUB_WORKSPACE/release-a-artifact"
            )
          fi
          audit_python=/usr/bin/python3.12
          test "$(sha256sum "$audit_python" | awk '{print $1}')" = \
            1643dacd9feaedc58f3cc581e4d22577dfe25c09b10282936186ccf0f2e61118
          (
            cd "$audit_root/checkout"
            "$audit_python" scripts/check_release_a_candidate.py "${args[@]}"
          )
          cosign sign-blob --yes \
            --bundle artifact-checkout.sigstore.json artifact-checkout.json
          cosign verify-blob artifact-checkout.json \
            --bundle artifact-checkout.sigstore.json \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com"

      - name: Upload signed exact-main artifact audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retail-artifact-audit-${{ github.sha }}
          path: |
            artifact-checkout.json
            artifact-checkout.sigstore.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload tested main release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retail-release-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
