name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend-check:
    runs-on: [self-hosted, unihub-server]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Python lint & typecheck
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt -r requirements-dev.txt 2>/dev/null
          venv/bin/pip install mypy 2>/dev/null
          venv/bin/mypy . --ignore-missing-imports --explicit-package-bases
          echo "Mypy: OK"

      - name: Backend tests
        run: |
          venv/bin/pytest . -v --tb=short --cov=. --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://unihub_retail_app:${{ secrets.DB_PASSWORD }}@127.0.0.1:5433/unihub_retail

  frontend-check:
    runs-on: [self-hosted, unihub-server]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install & typecheck
        run: |
          npm install
          npx tsc --noEmit
          echo "TypeScript: OK"

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload source maps to GlitchTip
        if: success()
        env:
          GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
        run: |
          if [ -n "$GLITCHTIP_DSN" ]; then
            npx @sentry/cli sourcemaps upload \
              --url "${GLITCHTIP_DSN}" \
              --org unihub \
              --project retail \
              ./dist 2>/dev/null || echo "Source maps upload skipped (GlitchTip CLI not configured)"
          else
            echo "No SENTRY_DSN set, skipping source maps upload"
          fi

  e2e-tests:
    runs-on: [self-hosted, unihub-server]
    needs: [backend-check, frontend-check]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'
