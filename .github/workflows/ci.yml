name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend-check:
    runs-on: [self-hosted, unihub-server]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Python environment
        run: |
          python3 -m venv venv
          venv/bin/pip install --disable-pip-version-check --quiet -r requirements.txt -r requirements-dev.txt

      - name: Python typecheck
        run: |
          set +e
          venv/bin/mypy . --ignore-missing-imports --explicit-package-bases > mypy-report.txt 2>&1
          status=$?
          cat mypy-report.txt
          exit $status

      - name: Upload mypy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: backend/mypy-report.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Backend tests
        run: |
          set +e
          scripts/run_tests_isolated.sh \
            -v \
            --tb=short \
            --cov=permissions \
            --cov=services.exports \
            --cov=services.grile_monthly \
            --cov=services.importer \
            --cov=services.imports \
            --cov=services.reporting_refresh \
            --cov=services.salarii \
            --cov=services.target_calculator \
            --cov-report=term \
            --cov-report=json:critical-coverage.json \
            > backend-test-report.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            venv/bin/python scripts/check_critical_coverage.py critical-coverage.json \
              >> backend-test-report.txt 2>&1
            status=$?
          fi
          cat backend-test-report.txt
          exit $status

      - name: Upload backend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/backend-test-report.txt
            backend/critical-coverage.json
          if-no-files-found: warn
          retention-days: 3

  frontend-check:
    runs-on: [self-hosted, unihub-server]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Install & typecheck
        run: |
          npm ci
          npx tsc --noEmit
          echo "TypeScript: OK"

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload source maps to GlitchTip
        if: success()
        env:
          SENTRY_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
          SENTRY_URL: https://errors.unihub.ro
          SENTRY_ORG: unihub
          SENTRY_PROJECT: retail
        run: |
          if [ -n "$SENTRY_DSN" ]; then
            npx @sentry/cli sourcemaps upload ./dist 2>/dev/null || echo "Source maps upload skipped"
          else
            echo "No SENTRY_DSN set, skipping source maps upload"
          fi