name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: [self-hosted, unihub-server]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Python environment
        run: |
          python3 -m venv venv
          venv/bin/pip install --disable-pip-version-check --quiet -r requirements.txt -r requirements-dev.txt

      - name: Runtime dependency smoke
        run: |
          runtime_root="$(mktemp -d)"
          trap 'rm -rf "$runtime_root"' EXIT
          runtime_venv="$runtime_root/venv"
          python3 -m venv "$runtime_venv"
          "$runtime_venv/bin/pip" install --disable-pip-version-check --quiet -r requirements.txt
          "$runtime_venv/bin/pip" check
          "$runtime_venv/bin/python" -c "import auth; import main; import worker"

      - name: Python dependency vulnerability audit
        run: venv/bin/pip-audit -r requirements.txt --strict --progress-spinner off

      - name: Tracked secret regression scan
        working-directory: .
        run: |
          mapfile -d '' tracked_files < <(
            git ls-files -z -- . \
              ':(exclude).secrets.baseline' \
              ':(exclude).bandit-baseline.json'
          )
          backend/venv/bin/detect-secrets-hook \
            --baseline .secrets.baseline \
            "${tracked_files[@]}"

      - name: Python static security regression scan
        working-directory: .
        run: |
          backend/venv/bin/bandit \
            -r backend \
            -x backend/tests,backend/venv \
            -ll \
            -ii \
            -q \
            -b .bandit-baseline.json

      - name: Python typecheck
        run: |
          set +e
          venv/bin/mypy . --ignore-missing-imports --explicit-package-bases > mypy-report.txt 2>&1
          status=$?
          cat mypy-report.txt
          exit $status

      - name: Immutable migration manifest
        run: |
          venv/bin/python -c "from db.migration_runner import load_migration_manifest, verify_migration_files; verify_migration_files(load_migration_manifest())"

      - name: Operational configuration validation
        working-directory: .
        run: |
          systemd-analyze verify \
            "$GITHUB_WORKSPACE/ops/systemd/unihub-backend.service" \
            "$GITHUB_WORKSPACE/unihub-worker.service" \
            "$GITHUB_WORKSPACE/ops/systemd/unihub-retail-migrate.service"
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$GITHUB_WORKSPACE/ops/observability/retail-slo-rules.yml:/rules.yml:ro" \
            prom/prometheus:v3.11.3 \
            check rules /rules.yml

      - name: Upload mypy diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mypy-report
          path: backend/mypy-report.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Backend tests
        run: |
          set +e
          scripts/run_tests_isolated.sh \
            -v \
            --tb=short \
            --cov=auth \
            --cov=oidc_settings \
            --cov=oidc_verifier \
            --cov=client_ip \
            --cov=rate_limit_settings \
            --cov=rate_limit_store \
            --cov=rate_limits \
            --cov=db.migration_runner \
            --cov=permissions \
            --cov=services.exports \
            --cov=services.grile_monthly \
            --cov=services.importer \
            --cov=services.imports \
            --cov=services.reporting_refresh \
            --cov=services.salarii \
            --cov=services.target_calculator \
            --cov-report=term \
            --cov-report=json:critical-coverage.json \
            > backend-test-report.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            venv/bin/python scripts/check_critical_coverage.py critical-coverage.json \
              >> backend-test-report.txt 2>&1
            status=$?
          fi
          cat backend-test-report.txt
          exit $status

      - name: Upload backend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-report
          path: |
            backend/backend-test-report.txt
            backend/critical-coverage.json
          if-no-files-found: warn
          retention-days: 3

  frontend-check:
    needs: backend-check
    runs-on: [self-hosted, unihub-server]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Strict frontend typecheck
        run: npm run typecheck:strict

      - name: Frontend lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload source maps to GlitchTip
        if: success()
        env:
          SENTRY_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
          SENTRY_URL: https://errors.unihub.ro
          SENTRY_ORG: unihub
          SENTRY_PROJECT: retail
        run: |
          if [ -n "$SENTRY_DSN" ]; then
            npx @sentry/cli sourcemaps upload ./dist 2>/dev/null || echo "Source maps upload skipped"
          else
            echo "No SENTRY_DSN set, skipping source maps upload"
          fi
