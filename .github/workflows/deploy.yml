name: Deploy verified Retail artifact

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID that produced the artifact
        required: true
        type: string
      source_sha:
        description: Exact 40-character main source SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  BASH_ENV: ""
  ENV: ""
  CDPATH: ""
  GLOBIGNORE: ""

concurrency:
  group: production-retail-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.PRODUCTION_DEPLOY_APPROVALS_ENFORCED == 'true'
      && github.ref == 'refs/heads/main'
    environment: production
    runs-on: [self-hosted, unihub-deploy]
    timeout-minutes: 60
    outputs:
      release_id: ${{ steps.release_identity.outputs.release_id }}
      source_sha: ${{ steps.release_identity.outputs.source_sha }}
      migration_head: ${{ steps.release_identity.outputs.migration_head }}
      artifact_sha256: ${{ steps.release_identity.outputs.artifact_sha256 }}
      sbom_sha256: ${{ steps.release_identity.outputs.sbom_sha256 }}
    steps:
      - name: Validate approved CI source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          GH_BIN=/usr/bin/gh
          test "$(sha256sum "$GH_BIN" | awk '{print $1}')" = \
            141507c337e8b202ad398550c3b73d72f5af92e86f71665214538a81efd4c409
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json="$("$GH_BIN" api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID")"
          test "$(jq -r .name <<<"$run_json")" = "CI"
          test "$(jq -r .event <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<<"$run_json")" = "main"
          test "$(jq -r .head_sha <<<"$run_json")" = "$EXPECTED_SHA"
          test "$(jq -r .status <<<"$run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: retail-release-${{ inputs.source_sha }}
          path: verified-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Install external signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        env:
          HOME: ${{ runner.temp }}
        with:
          cosign-release: v3.1.3
          install-dir: ${{ runner.temp }}/cosign

      - name: Verify artifact manifest
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          HOME: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd verified-release
          test -f RELEASE_MANIFEST.sigstore.json
          COSIGN_BIN="$RUNNER_TEMP/cosign/cosign"
          test "$(sha256sum "$COSIGN_BIN" | awk '{print $1}')" = \
            4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
          "$COSIGN_BIN" verify-blob RELEASE_MANIFEST.json \
            --bundle RELEASE_MANIFEST.sigstore.json \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$EXPECTED_SHA" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-trigger "workflow_dispatch" \
            --certificate-github-workflow-name "CI"
          sha256sum --check SHA256SUMS
          test "$(tr -d '\n' < SOURCE_SHA)" = "$EXPECTED_SHA"
          test -f "retail-release-${EXPECTED_SHA}.tar.gz"

      - name: Capture signed release identity
        id: release_identity
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          cd verified-release
          schema_version="$(jq -er '.schemaVersion' RELEASE_MANIFEST.json)"
          source_sha="$(jq -er '.sourceSha | select(type == "string")' RELEASE_MANIFEST.json)"
          release_id="$(jq -er '.releaseId | select(type == "string")' RELEASE_MANIFEST.json)"
          migration_head="$(jq -er '.migrationHead | select(type == "string")' RELEASE_MANIFEST.json)"
          artifact_sha256="$(jq -er '.artifactSha256 | select(type == "string")' RELEASE_MANIFEST.json)"
          sbom_sha256="$(jq -er '.sbomSha256 | select(type == "string")' RELEASE_MANIFEST.json)"
          archive="retail-release-${EXPECTED_SHA}.tar.gz"
          inventory_artifact="$(jq -er --arg archive "$archive" '.sha256[$archive] | select(type == "string")' RELEASE_MANIFEST.json)"
          inventory_sbom="$(jq -er '.sha256["SBOM.cdx.json"] | select(type == "string")' RELEASE_MANIFEST.json)"

          test "$schema_version" = "1"
          test "$source_sha" = "$EXPECTED_SHA"
          test "$release_id" = "retail-release-$EXPECTED_SHA"
          [[ "$migration_head" =~ ^[0-9]{3}_[A-Za-z0-9_]+\.sql$ ]]
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$sbom_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$artifact_sha256" = "$inventory_artifact"
          test "$sbom_sha256" = "$inventory_sbom"

          printf 'release_id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >>"$GITHUB_OUTPUT"
          printf 'migration_head=%s\n' "$migration_head" >>"$GITHUB_OUTPUT"
          printf 'artifact_sha256=%s\n' "$artifact_sha256" >>"$GITHUB_OUTPUT"
          printf 'sbom_sha256=%s\n' "$sbom_sha256" >>"$GITHUB_OUTPUT"

      - name: Verify public proxy hardening gate
        run: |
          set -euo pipefail
          for path in /metrics /docs /redoc /openapi.json; do
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 10 \
              "https://retail.unihub.ro${path}")"
            if [[ "$status" != "404" ]]; then
              echo "::error::Public route ${path} returned ${status}, expected 404; deploy is blocked."
              exit 1
            fi
          done

      - name: Acquire global production deploy lane
        run: |
          sudo --non-interactive /usr/local/sbin/unihub-deploy-lock acquire \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 1800 1800

      - name: Deploy through root-owned entrypoint
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          test -x /opt/Mobiup/ops/scripts/deploy-retail-artifact.sh
          cd verified-release
          artifact="retail-release-${EXPECTED_SHA}.tar.gz"
          artifact_sha256="$(awk -v file="$artifact" '$2 == file {print $1}' SHA256SUMS)"
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
          entrypoint=/opt/Mobiup/ops/scripts/deploy-retail-artifact.sh
          test "$(stat -c '%u:%g:%a' "$entrypoint")" = "0:0:755"
          expected_entrypoint_sha256="$(
            tar -xOzf "$artifact" ./ops/deploy-retail-artifact.sh | sha256sum | awk '{print $1}'
          )"
          test "$(sha256sum "$entrypoint" | awk '{print $1}')" = \
            "$expected_entrypoint_sha256"
          sudo --non-interactive \
            /opt/Mobiup/ops/scripts/deploy-retail-artifact.sh \
            "$PWD/$artifact" \
            "$EXPECTED_SHA" \
            "$CI_RUN_ID" \
            "$artifact_sha256"

      - name: Release global production deploy lane
        if: always()
        run: |
          sudo --non-interactive /usr/local/sbin/unihub-deploy-lock release \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  tag-promoted-release:
    name: tag-promoted-release
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout trusted deployment control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create or verify canonical production tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.deploy.outputs.source_sha }}
          RELEASE_ID: ${{ needs.deploy.outputs.release_id }}
          MIGRATION_HEAD: ${{ needs.deploy.outputs.migration_head }}
          ARTIFACT_SHA256: ${{ needs.deploy.outputs.artifact_sha256 }}
          SBOM_SHA256: ${{ needs.deploy.outputs.sbom_sha256 }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -I scripts/create_production_release_tag.py \
            --repository "$REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --release-id "$RELEASE_ID" \
            --migration-head "$MIGRATION_HEAD" \
            --artifact-sha256 "$ARTIFACT_SHA256" \
            --sbom-sha256 "$SBOM_SHA256" \
            --ci-run-id "$CI_RUN_ID" \
            --deploy-run-id "$DEPLOY_RUN_ID"
