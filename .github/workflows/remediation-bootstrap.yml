name: Finalize forensic remediation

on:
  push:
    branches:
      - agent/forensic-remediation-20260807

permissions:
  contents: write

concurrency:
  group: forensic-remediation-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, dell-compute, unihub-build, unihub-retail-build]
    timeout-minutes: 20
    env:
      EXPECTED_BRANCH: agent/forensic-remediation-20260807
      EXPECTED_BASE: 5a0325f6bcd2ecc15a2e120e879dff99e6f089fb
      EXPECTED_PAYLOAD_SHA256: befc669faf6da3b275d51b049418cb33d6836c316aca8c1515d53eda85c91c0a
      PAYLOAD: /tmp/forensic-remediation.tar.xz
      BOOTSTRAP_LOG: /tmp/forensic-remediation-bootstrap.log
    steps:
      - name: Prove trusted Dell runner isolation
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "self-hosted"
          test "$RUNNER_NAME" = "dell-retail-build"
          test "$(hostname)" = "dell-standby"
          test ! -e /run/dell-compute/quiesced
          test ! -e /var/lib/dell-standby/ACTIVE
          test ! -r /opt/Mobiup/unihub-retail/.env
          test ! -r /opt/Mobiup/.ssh/id_ed25519_mobiup_primary_admin
          test ! -r /home/andrei/.ssh/id_ed25519
          test ! -e /storage/backups
          test ! -e /run/tailscale/tailscaled.sock

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Materialize, regenerate and publish one final commit
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_head="$(git rev-parse HEAD)"
          git config user.name "OpenAI remediation agent"
          git config user.email "noreply@openai.com"
          : > "$BOOTSTRAP_LOG"
          exec > >(tee -a "$BOOTSTRAP_LOG") 2>&1

          diagnose_failure() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              set +e
              git reset --hard "$bootstrap_head"
              git clean -fdx
              mkdir -p .remediation
              {
                echo "Forensic remediation bootstrap failed."
                echo "bootstrap_head=$bootstrap_head"
                echo "expected_base=$EXPECTED_BASE"
                echo "exit_status=$status"
                echo
                tail -n 400 "$BOOTSTRAP_LOG"
              } > .remediation/bootstrap-failure.txt
              git add .remediation/bootstrap-failure.txt
              git commit -m "chore: record remediation bootstrap failure"
              git push origin "HEAD:$EXPECTED_BRANCH"
            fi
            exit "$status"
          }
          trap diagnose_failure EXIT

          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          cat .remediation/payload.part* | base64 --decode > "$PAYLOAD"
          echo "$EXPECTED_PAYLOAD_SHA256  $PAYLOAD" | sha256sum --check -

          payload_root="$(mktemp -d)"
          tar --list --xz --file "$PAYLOAD" | while IFS= read -r member; do
            case "$member" in
              /*|../*|*/../*|*/..)
                echo "Unsafe payload member: $member" >&2
                exit 1
                ;;
            esac
          done
          tar --extract --xz --file "$PAYLOAD" --directory "$payload_root"

          git apply --check "$payload_root/remediation.patch"
          git apply "$payload_root/remediation.patch"
          cp -a "$payload_root/overlay/." .
          rm -rf .remediation "$payload_root" "$PAYLOAD"

          python -m venv backend/venv
          backend/venv/bin/pip install --disable-pip-version-check --quiet \
            --require-hashes -r backend/requirements-dev.lock
          PYTHONPATH=backend backend/venv/bin/python scripts/generate_retail_contract.py
          rm -rf backend/venv

          git show "$EXPECTED_BASE:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm -f .github/workflows/remediation-bootstrap.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')

          start = text.index('on:\n')
          end = text.index('\nconcurrency:\n', start)
          trigger = '''on:
            # Internal pull requests receive exact-SHA verification. Dispatch on main
            # remains the immutable release-artifact gate.
            workflow_dispatch:
            pull_request:
              branches:
                - main
          '''
          text = text[:start] + trigger + text[end:]

          old_if = "    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'\n"
          new_if = '''    if: >-
              github.event_name == 'workflow_dispatch'
              || (
                github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name == github.repository
              )
          '''
          if text.count(old_if) != 1:
              raise SystemExit('CI runner-isolation contract changed upstream')
          text = text.replace(old_if, new_if, 1)

          marker = '''      - name: OpenAPI contract drift
                working-directory: .
                run: PYTHONPATH=backend backend/venv/bin/python scripts/generate_retail_contract.py --check
          '''
          addition = marker + '''
                - name: Complexity ratchet
                  working-directory: .
                  run: backend/venv/bin/python scripts/check_complexity_ratchet.py
          '''
          if text.count(marker) != 1:
              raise SystemExit('CI OpenAPI step changed upstream')
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test -f backend/db/migrations/059_grile_v2_read_contract.sql
          test -f backend/db/migrations/060_leave_request_date_contract.sql
          test -f docs/operations/SERVER_AGENT_PROMPT_FORENSIC_REMEDIATION.md
          test -x ops/verify-forensic-remediation-runtime.sh

          git add -A
          git reset --soft "$EXPECTED_BASE"
          git commit -m "feat: implement forensic remediation plan"
          final_sha="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/$EXPECTED_BRANCH:$bootstrap_head" \
            origin "HEAD:$EXPECTED_BRANCH"
          echo "Published final remediation commit $final_sha"
          trap - EXIT
