name: V3 history browser acceptance (cert-only)

on:
  pull_request:
    branches:
      - main
    paths:
      - "e2e/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.ts"
      - ".github/workflows/v3-history-browser-cert.yml"

concurrency:
  group: v3-history-browser-cert-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: v3-history-browser-cert
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'v3/cert-history-browser-execution'
    runs-on: [self-hosted, Linux, X64, dell-compute, unihub-build, unihub-retail-build]
    timeout-minutes: 35
    env:
      CI: "true"
      RETAIL_NODE: /opt/codex-desktop/resources/node-runtime/bin/node
      RETAIL_NPM_CLI: /opt/codex-desktop/resources/node-runtime/lib/node_modules/npm/bin/npm-cli.js
      PATH: /opt/codex-desktop/resources/node-runtime/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      VITE_FRONTEND_GLITCHTIP_DSN: ""
    steps:
      - name: Prove isolated build runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_NAME" = dell-retail-build
          test "$(hostname)" = dell-standby
          test ! -e /run/dell-compute/quiesced
          test ! -e /var/lib/dell-standby/ACTIVE
          test ! -r /opt/Mobiup/unihub-retail/.env
          test ! -r /opt/Mobiup/.ssh/id_ed25519_mobiup_primary_admin
          test ! -r /home/andrei/.ssh/id_ed25519
          test ! -e /storage/backups
          test ! -e /run/tailscale/tailscaled.sock

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify exact candidate identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git status --short)" = ""

      - name: Verify pinned Node.js and npm
        run: |
          set -euo pipefail
          test "$(sha256sum "$RETAIL_NODE" | awk '{print $1}')" = 81925c0995b5c1427b5d538e6a90ca2fdc4daffb786b09af749beaf7369d4e90
          test "$(sha256sum "$RETAIL_NPM_CLI" | awk '{print $1}')" = 8e5f6f3429f8cdbe693cdc29904e9d5a7b127a494bd15c804bd54c7403bfcbe7
          test "$("$RETAIL_NODE" --version)" = v22.22.2
          test "$("$RETAIL_NODE" "$RETAIL_NPM_CLI" --version)" = 10.9.7

      - name: Verify vendored packages and dependency policy
        run: |
          "$RETAIL_NODE" scripts/verify_vendored_npm_packages.mjs
          "$RETAIL_NODE" scripts/check_dependency_policy.mjs

      - name: Install frontend dependencies
        run: "$RETAIL_NODE" "$RETAIL_NPM_CLI" ci --include=dev

      - name: Build exact candidate
        run: "$RETAIL_NODE" "$RETAIL_NPM_CLI" run build

      - name: Install Chromium
        run: "$RETAIL_NODE" node_modules/@playwright/test/cli.js install chromium

      - name: Run focused V3 history browser acceptance
        run: |
          "$RETAIL_NODE" "$RETAIL_NPM_CLI" run test:e2e -- \
            e2e/history-v3-acceptance.spec.ts \
            e2e/desktop-wave3-responsive.spec.ts

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: v3-history-browser-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 3
