name: V3 bounded doc patch helper

on:
  pull_request:
    branches: [v3/main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-history-agent-architecture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'v3/history-agent-datagrid'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact architecture boundary correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('APP_ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          old = '''Frontendul reda aceleasi coloane curente si istorice RM/Magazine/Agenti prin
          componenta tipizata `dashboard/BreakdownTable.tsx`, care centralizeaza tabelul
          sortabil si exportul Excel fara a schimba payload-urile API.'''
          new = '''Frontendul reda tabelele curente RM/Magazine/Agenti prin componenta tipizata
          `dashboard/BreakdownTable.tsx`. In `Hub -> Istoric`, breakdown-urile
          RM/Magazine/Agenti folosesc shared V3 `common/DataGrid.tsx` prin adaptoarele
          dedicate `historyRegionalDataGrid.ts`, `historyStoreDataGrid.ts` si
          `historyAgentDataGrid.ts`, pastrand payload-urile API si proiectiile legacy de
          export acolo unde acestea difera de coloanele vizibile.'''

          count = text.count(old)
          if count == 0:
              print('Architecture boundary already corrected; no write needed.')
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale paragraph, found {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet -- APP_ARCHITECTURE.md; then
            exit 0
          fi
          git diff -- APP_ARCHITECTURE.md
          test "$(git diff --name-only | tr -d '\n')" = "APP_ARCHITECTURE.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP_ARCHITECTURE.md
          git commit -m "docs(v3): clarify dashboard table boundary"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
