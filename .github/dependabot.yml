# Dependency automation. Weekly grouped PRs; majors remain separate for review.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Keep the dependency queue reviewable: one grouped minor/patch PR plus
    # at most two separate updates (typically majors) at the same time.
    open-pull-requests-limit: 3
    # Private @unihub packages are served by the host-only Verdaccio registry
    # and are upgraded through the shared-packages release workflow.
    ignore:
      - dependency-name: "@unihub/*"
      # Keep compiler/runtime types aligned with the deployed Node 22 toolchain.
      # Major upgrades require a deliberate toolchain migration.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # arq 0.28 currently requires redis<6; keep the runtime client on the
      # compatible major until the queue framework is deliberately upgraded.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
