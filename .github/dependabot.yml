# Version-update PRs are disabled; security-update configuration remains available.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    # Private @unihub packages are vendored as integrity-checked tarballs and
    # are upgraded only through the reviewed shared-package release workflow.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@unihub/*"
      # Keep compiler/runtime types aligned with the deployed Node 22 toolchain.
      # Major upgrades require a deliberate toolchain migration.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # arq 0.28 currently requires redis<6; keep the runtime client on the
      # compatible major until the queue framework is deliberately upgraded.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
